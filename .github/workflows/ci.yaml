name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # put all test dependent on image magick into a single job to avoid repeat setup
  tests:
    # required for image magick 7.1
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y libmagickwand-dev libclang-dev clang pkg-config
      - run: cargo test --workspace --all-targets --all-features
      - name: clippy normal
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic
      - name: clippy pedantic
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic
        env:
          RUSTFLAGS: ""

