name: Generate Wallpaper
description: Create daily wallpaper
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  make-wallpaper:
    name: "Generate the wallpaper image"
    runs-on: ubuntu-slim
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      # TODO create-github-app-token to allow pushing around restrictions
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y jq imagemagick procps
      - name: create the new wallpaper
        run: src/create_wallpaper.sh assets data
      - name: setup and configure gitsign
        run: |
          wget https://github.com/sigstore/gitsign/releases/download/v0.17.1/gitsign_0.17.1_linux_amd64.deb
          sudo dpkg -i gitsign_0.17.1_linux_amd64.deb
          git config --global gpg.x509.program gitsign
          git config --global gpg.format x509
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
      - name: push new wallpaper
        env:
          GITSIGN_OIDC_MODE: ambient
        run: |
          git config user.name  'wallpaper-bot[bot]'
          git config user.email 'wallpaper-bot[bot]@users.noreply.github.com'
          git add -f assets/wallpaper.png
          git diff --staged --quiet && exit 0
          git commit -m '[gh-action] Daily Wallpaper'
          git push origin HEAD:main
