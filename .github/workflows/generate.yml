name: Generate Wallpaper
description: Create daily wallpaper
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  make-wallpaper:
    name: "Generate the wallpaper image"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      # TODO create-github-app-token to allow pushing around restrictions
      - uses: actions/checkout@v3
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y jq imagemagick procps
      - name: create the new wallpaper
        run: src/create_wallpaper.sh assets data
      - name: push new wallpaper
        run: |
          git config user.name  'wallpaper-bot[bot]'
          git config user.email 'wallpaper-bot[bot]@users.noreply.github.com'
          git add -f assets/wallpaper.png
          git diff --staged --quiet && exit 0
          git commit -m '[gh-action] Daily Wallpaper'
          git push origin HEAD:main
