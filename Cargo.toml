[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[features]
default = ["imgmagick"]
imgmagick = ["dep:magick_rust"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
magick_rust = { version = "2.1.1", optional = true }
rand = "0.10.2"
regex = "1"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
url = "2.5.8"
