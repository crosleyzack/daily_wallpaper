version: '3'

tasks:
  install:
    dir: "{{.TASKFILE_DIR}}"
    desc: Perform install
    cmds:
      - ./src/install.sh

  create:
    dir: "{{.TASKFILE_DIR}}"
    desc: Create New Wallpaper
    cmds:
      - docker build -f .devcontainer/Dockerfile . -t devcontainer:latest
      - docker build . -t quote-wallpaper
      - docker run --userns=keep-id --mount "type=bind,source={{.TASKFILE_DIR}},target=/repo,Z" quote-wallpaper

  set:
    desc: Sets wallpaper
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo run --no-default-features set

  sync:
    desc: Pulls wallpaper from remote host
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo run --no-default-features sync
